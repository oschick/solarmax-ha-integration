name: Weekly compatibility canary

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-home-assistant-canary
  cancel-in-progress: false

jobs:
  latest:
    name: Latest Home Assistant on Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install latest test environment
        run: >-
          python -m pip install --disable-pip-version-check
          pytest-homeassistant-custom-component

      - name: Print resolved versions
        run: |
          python --version
          python -c 'from importlib.metadata import version; print("Home Assistant", version("homeassistant")); print("Test plugin", version("pytest-homeassistant-custom-component"))'

      - name: Run tests
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pytest tests/ -q --junitxml="$REPORT_DIR/junit.xml"

      - name: Write test summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          if [[ -f "$REPORT_DIR/junit.xml" ]]; then
            python script/ci-summary "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-home-assistant-reports
          path: ${{ runner.temp }}/solarmax-ci
          if-no-files-found: ignore
          retention-days: 7
