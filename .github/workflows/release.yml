name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/solarmax/manifest.json
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in vX.Y.Z[-suffix] form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare or validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      active: ${{ steps.version.outputs.active }}
      ready: ${{ steps.prepare.outputs.ready }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main, not $DISPATCH_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve release tag
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
            active=true
          else
            source_version="$(python -c 'import json; print(json.load(open("custom_components/solarmax/manifest.json"))["version"])')"
            previous_version="$(git show "$BEFORE_SHA:custom_components/solarmax/manifest.json" | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
            release_tag="v$source_version"
            if [[ "$source_version" == "$previous_version" ]]; then
              active=false
            else
              active=true
            fi
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check or prepare release metadata
        if: steps.version.outputs.active == 'true'
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if python script/check-release "$RELEASE_TAG"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python script/prepare-release "$RELEASE_TAG"
            python script/check-release "$RELEASE_TAG"
            git diff --check
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merged release metadata is invalid" >&2
            exit 1
          fi

      - name: Create release preparation branch
        if: steps.prepare.outputs.ready == 'false'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_branch="release/${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$release_branch"
          git add CHANGELOG.md pyproject.toml custom_components/solarmax/manifest.json
          git commit -m "chore: prepare $RELEASE_TAG"

          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            git fetch origin "$release_branch"
            if [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
              echo "origin/$release_branch already exists with different changes" >&2
              exit 1
            fi
          else
            original_remote="$(git remote get-url origin)"
            authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git remote set-url origin "$authenticated_remote"
            if ! git push --set-upstream origin "$release_branch"; then
              git remote set-url origin "$original_remote"
              exit 1
            fi
            git remote set-url origin "$original_remote"
          fi

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${release_branch}?expand=1"
          echo "branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "compare-url=$compare_url" >> "$GITHUB_OUTPUT"

      - name: Summarize preparation
        if: steps.prepare.outputs.ready == 'false'
        env:
          COMPARE_URL: ${{ steps.branch.outputs.compare-url }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Release preparation"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- [Open the preparation pull request]($COMPARE_URL)"
            echo "- Merge the pull request to create the draft release."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Validate and create draft
    needs: prepare
    if: >-
      needs.prepare.outputs.active == 'true' &&
      needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements_quality.txt
            requirements_test.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Run repository checks
        env:
          CI_REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: script/check

      - name: Write test summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          if [[ -f "$REPORT_DIR/junit.xml" ]]; then
            python script/ci-summary "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-reports
          path: ${{ runner.temp }}/solarmax-ci
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate source and release notes
        id: release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          python script/check-release "$RELEASE_TAG"
          --notes-output release-notes.md
          --github-output "$GITHUB_OUTPUT"

      - name: Build tracked release archive
        run: >-
          git archive --format=zip --prefix=solarmax/
          --output=solarmax.zip
          "$GITHUB_SHA:custom_components/solarmax"

      - name: Inspect release archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python script/check-release "$RELEASE_TAG" --archive solarmax.zip

      - name: Import packaged integration
        env:
          RELEASE_ROOT: ${{ runner.temp }}/solarmax-release
        run: |
          mkdir -p "$RELEASE_ROOT"
          python -m zipfile -e solarmax.zip "$RELEASE_ROOT"
          PYTHONPATH="$RELEASE_ROOT" python -c 'import solarmax'

      - name: Add compare link to release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" \
              >> release-notes.md
          fi

      - name: Check existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if tag_commit="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "$RELEASE_TAG already has a published release" >&2
              exit 1
            fi
          fi

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: solarmax.zip

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease="$IS_PRERELEASE"
            gh release upload "$RELEASE_TAG" solarmax.zip --clobber
          else
            gh release create "$RELEASE_TAG" solarmax.zip \
              --draft \
              --prerelease="$IS_PRERELEASE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Summarize release
        env:
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          archive_hash="$(sha256sum solarmax.zip | cut -d ' ' -f 1)"
          {
            echo "### Draft release"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Prerelease: \`$IS_PRERELEASE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- SHA-256: \`$archive_hash\`"
          } >> "$GITHUB_STEP_SUMMARY"
