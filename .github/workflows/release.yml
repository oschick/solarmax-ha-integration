name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements_quality.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Validate tagged source
        run: |
          script/check
          python script/check-release "$GITHUB_REF_NAME"

      - name: Build manual-install archive
        working-directory: custom_components
        run: zip -r ../solarmax.zip solarmax -x "*/__pycache__/*" "*.pyc"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: solarmax.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
