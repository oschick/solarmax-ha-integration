name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in vX.Y.Z form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and create draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main, not $DISPATCH_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements_quality.txt
            requirements_test.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Run repository checks
        env:
          CI_REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: script/check

      - name: Write test summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          if [[ -f "$REPORT_DIR/junit.xml" ]]; then
            python script/ci-summary "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-reports
          path: ${{ runner.temp }}/solarmax-ci
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate source and release notes
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: >-
          python script/check-release "$RELEASE_TAG"
          --notes-output release-notes.md

      - name: Build tracked release archive
        run: >-
          git archive --format=zip --prefix=solarmax/
          --output=solarmax.zip
          "$GITHUB_SHA:custom_components/solarmax"

      - name: Inspect release archive
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: python script/check-release "$RELEASE_TAG" --archive solarmax.zip

      - name: Import packaged integration
        env:
          RELEASE_ROOT: ${{ runner.temp }}/solarmax-release
        run: |
          mkdir -p "$RELEASE_ROOT"
          python -m zipfile -e solarmax.zip "$RELEASE_ROOT"
          PYTHONPATH="$RELEASE_ROOT" python -c 'import solarmax'

      - name: Add compare link to release notes
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" \
              >> release-notes.md
          fi

      - name: Check existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git fetch --force --tags origin
          if tag_commit="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "$RELEASE_TAG already has a published release" >&2
              exit 1
            fi
          fi

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: solarmax.zip

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" solarmax.zip --clobber
          else
            gh release create "$RELEASE_TAG" solarmax.zip \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          archive_hash="$(sha256sum solarmax.zip | cut -d ' ' -f 1)"
          {
            echo "### Draft release"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- SHA-256: \`$archive_hash\`"
          } >> "$GITHUB_STEP_SUMMARY"
