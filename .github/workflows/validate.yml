name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HACS metadata
        # The pinned action delegates to ghcr.io/hacs/action:main internally.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate integration metadata
        # The upstream action selects its current Hassfest container.
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  workflow-lint:
    name: Workflow security and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_quality.txt

      - name: Install workflow tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements_quality.txt

      - name: Run actionlint
        run: python -m pre_commit run actionlint --all-files

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          version: v1.30.0

  quality:
    name: Quality and Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements_quality.txt
            requirements_test.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Run repository checks
        env:
          CI_REPORT_DIR: ${{ runner.temp }}/solarmax-ci
          SKIP: actionlint
        run: script/check

      - name: Check changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: >-
          diff-cover "$REPORT_DIR/coverage.xml"
          --compare-branch="origin/$BASE_REF"
          --fail-under=90
          --show-uncovered
          --format="markdown:$REPORT_DIR/diff-coverage.md"

      - name: Write test summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          if [[ -f "$REPORT_DIR/junit.xml" ]]; then
            python script/ci-summary "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$REPORT_DIR/diff-coverage.md" ]]; then
            cat "$REPORT_DIR/diff-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: ${{ runner.temp }}/solarmax-ci
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum compatibility (Python 3.12, HA 2024.12)
            python: "3.12"
            requirements: requirements_min.txt
            artifact: python-3.12-reports
          - name: Current compatibility (Python 3.13)
            python: "3.13"
            requirements: requirements_test.txt
            artifact: python-3.13-reports
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test environment
        env:
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: >-
          python -m pip install --disable-pip-version-check
          -r "$REQUIREMENTS_FILE"

      - name: Run tests
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pytest tests/ -q --junitxml="$REPORT_DIR/junit.xml"

      - name: Write test summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/solarmax-ci
        run: |
          if [[ -f "$REPORT_DIR/junit.xml" ]]; then
            python script/ci-summary "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/solarmax-ci
          if-no-files-found: ignore
          retention-days: 7

  merge-gate:
    if: always()
    name: CI / Merge gate
    needs:
      - hacs
      - hassfest
      - workflow-lint
      - quality
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HACS_RESULT: ${{ needs.hacs.result }}
      HASSFEST_RESULT: ${{ needs.hassfest.result }}
      WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
    steps:
      - name: Require every validation job
        run: |
          for result in \
            "$HACS_RESULT" \
            "$HASSFEST_RESULT" \
            "$WORKFLOW_LINT_RESULT" \
            "$QUALITY_RESULT" \
            "$COMPATIBILITY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "Required validation result: $result"
              exit 1
            fi
          done
          echo "All required validation jobs passed." >> "$GITHUB_STEP_SUMMARY"
