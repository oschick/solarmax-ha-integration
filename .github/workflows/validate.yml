name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: HACS Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
      
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: brands

  hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
      
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
        with:
          path: "./custom_components/solarmax"

  lint:
    runs-on: "ubuntu-latest"
    name: Code Quality
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort
      
      - name: Check formatting with Black
        run: black --check --diff custom_components/
      
      - name: Check import sorting with isort
        run: isort --check-only --diff custom_components/

  test:
    runs-on: "ubuntu-latest"
    name: Run Tests
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Run tests
        run: pytest tests/ --cov=custom_components --cov-report=term-missing

  build:
    runs-on: "ubuntu-latest"
    name: Build Integration Package
    needs: [validate, hassfest, lint, test]
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('custom_components/solarmax/manifest.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP file
        run: |
          cd custom_components
          zip -r ../solarmax-${{ steps.version.outputs.version }}.zip solarmax/

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarmax-${{ steps.version.outputs.version }}
          path: solarmax-${{ steps.version.outputs.version }}.zip
          retention-days: 7
