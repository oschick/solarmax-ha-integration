name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  hacs:
    if: github.event_name != 'schedule'
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate HACS metadata
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

  hassfest:
    if: github.event_name != 'schedule'
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate integration metadata
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
        with:
          path: ./custom_components/solarmax

  quality:
    if: github.event_name != 'schedule'
    name: Quality and current compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements_quality.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Run repository checks
        run: script/check

  minimum:
    if: github.event_name != 'schedule'
    name: Minimum compatibility (Python 3.12, HA 2024.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml

      - name: Install minimum test environment
        run: >-
          python -m pip install --disable-pip-version-check
          pytest-homeassistant-custom-component==0.13.190

      - name: Run tests
        run: python -m pytest tests/ -q

  latest:
    if: github.event_name == 'schedule'
    name: Latest Home Assistant compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml

      - name: Install latest test environment
        run: >-
          python -m pip install --disable-pip-version-check
          pytest-homeassistant-custom-component

      - name: Run tests
        run: python -m pytest tests/ -q
