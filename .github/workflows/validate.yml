name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: HACS Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: brands

  hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
        with:
          path: "./custom_components/solarmax"

  lint:
    runs-on: "ubuntu-latest"
    name: Code Quality
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check custom_components/ tests/

      - name: Check formatting with ruff
        run: ruff format --check custom_components/ tests/

  tests:
    runs-on: "ubuntu-latest"
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            environment: HA 2024.12 minimum
            homeassistant-spec: "homeassistant==2024.12.0"
            pytest-ha-spec: "pytest-homeassistant-custom-component==0.13.190"
          - python-version: "3.13"
            environment: latest HA
            homeassistant-spec: "homeassistant>=2024.12.0"
            pytest-ha-spec: "pytest-homeassistant-custom-component>=0.13.190"
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt "${{ matrix.homeassistant-spec }}" "${{ matrix.pytest-ha-spec }}"

      - name: Run tests
        run: pytest tests/ --cov=custom_components/solarmax

      - name: Type check
        run: mypy custom_components/solarmax
